          <div class="picker" id="poemPicker"></div>
          <select id="poemSelect" class="native-hidden" tabindex="-1" aria-hidden="true"></select>
          <button class="btn-primary" id="startByPick">开始练习</button>
        </div>
      </div>
      <div class="mode-block">
        <h3>随机实战</h3>
        <p class="hint">从题库中随机抽取一首（或片段）作为题目</p>
        <button class="btn-primary" id="startRandom">随机抽题</button>
      </div>
      <div class="mode-block opt">
        <label class="switch">
          <input type="checkbox" id="timedToggle" checked>
          <span>启用 3 分钟倒计时（模拟考核）</span>
        </label>
      </div>
    </div>
  </section>

  <!-- ========== 练习 ========== -->
  <section id="page-practice" class="page">
    <header class="bar">
      <button class="back" id="quitPractice">‹ 退出</button>
      <h2 id="practiceTitle">—</h2>
      <div class="timer-box" id="timerBox" hidden>
        <span class="tb-label">剩余</span>
        <span class="timer" id="timer">03:00</span>
      </div>
    </header>
    <div class="practice-wrap">
      <p class="practice-sub" id="practiceSub">—</p>
      <div class="poem" id="poemArea"></div>
      <p class="legend">
        <span class="lg"><i class="cell-demo ping"></i>平</span>
        <span class="lg"><i class="cell-demo ze"></i>仄</span>
        <span class="lg-hint">点击字下方格子：空 → 平 → 仄 → 空</span>
      </p>
      <button class="btn-primary wide" id="submitBtn">提 交</button>
    </div>
  </section>

  <!-- ========== 批改结果 ========== -->
  <section id="page-result" class="page">
    <header class="bar">
      <button class="back" data-go="mode">‹ 返回选择</button>
      <h2>批改结果</h2>
      <span class="bar-spacer"></span>
    </header>
    <div class="result-wrap">
      <div class="score-card" id="scoreCard"></div>
      <div class="review-poem" id="reviewPoem"></div>
      <div class="review" id="reviewArea"></div>
      <div class="result-actions">
        <button class="btn-primary" data-go="mode">再练一首</button>
        <button class="btn-ghost" data-go="home">返回首页</button>
      </div>
    </div>
  </section>

  <!-- ========== 入声字判别 · 准备（缓冲） ========== -->
  <section id="page-ruready" class="page">
    <header class="bar">
      <button class="back" data-go="home">‹ 首页</button>
      <h2>入声字判别</h2>
      <span class="bar-spacer"></span>
    </header>
    <div class="ru-ready">
      <p class="ready-tip">准备好后点击「开始练习」<br>
        将出现 <b>15 个字</b>，<span id="ruTimeHint">需在 <b>15 秒</b>内</span>点选全部入声字</p>
      <div class="ru-time-row">
        <span class="ru-time-label">练习时长</span>
        <div class="picker" id="ruTimePicker"></div>
        <select id="ruTimeSelect" class="native-hidden" tabindex="-1" aria-hidden="true">
          <option value="15" selected>15 秒</option>
          <option value="30">30 秒</option>
          <option value="45">45 秒</option>
          <option value="60">60 秒</option>
          <option value="0">不限时</option>
        </select>
      </div>
      <button class="btn-primary wide" id="ruBegin">开 始 练 习</button>
    </div>
  </section>

  <!-- ========== 入声字判别 · 练习 ========== -->
  <section id="page-rusheng" class="page">
    <header class="bar">
      <button class="back" data-go="ruready">‹ 返回</button>
      <h2>入声字判别</h2>
      <span class="timer" id="ruTimer" hidden>15</span>
    </header>
    <div class="ru-wrap">
      <p class="practice-sub">下列 15 个字中，点选<b>全部入声字</b></p>
      <div class="ru-grid" id="ruGrid"></div>
      <p class="legend">
        <span class="lg-hint">点击字块：选中 / 取消</span>
      </p>
      <button class="btn-primary wide" id="ruSubmit">提 交</button>
    </div>
  </section>

  <!-- ========== 入声字判别 · 批改 ========== -->
  <section id="page-ruresult" class="page">
    <header class="bar">
      <button class="back" data-go="home">‹ 返回首页</button>
      <h2>批改结果</h2>
      <span class="bar-spacer"></span>
    </header>
    <div class="result-wrap">
      <div class="score-card" id="ruScore"></div>
      <div class="review-grid" id="reviewGrid"></div>
      <div class="review" id="ruReview"></div>
      <div class="result-actions">
        <button class="btn-primary" id="ruAgain">再练一组</button>
        <button class="btn-ghost" data-go="home">返回首页</button>
      </div>

    </div>
  </section>

  <!-- ========== 弹窗 ========== -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" id="modalBox"></div>
  </div>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
